# Configuração de segurança do deploy na Netlify.
# (Comando de build e pasta de publicação continuam os mesmos do painel.)

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    # SAMEORIGIN em vez de DENY: o login com Google do Firebase usa um iframe do próprio domínio.
    X-Frame-Options = "SAMEORIGIN"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # CSP em modo "Report-Only": só registra violações no console, não bloqueia.
    # Depois de navegar por todas as páginas sem avisos no console, troque o
    # nome do cabeçalho para "Content-Security-Policy" para passar a bloquear.
    Content-Security-Policy-Report-Only = """
      default-src 'self';
      script-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://apis.google.com https://www.gstatic.com https://www.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://servicodados.ibge.gov.br https://cdn.jsdelivr.net https://raw.githubusercontent.com https://maps.gstatic.com;
      frame-src 'self' https://*.firebaseapp.com https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'self';
      upgrade-insecure-requests
    """

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
